name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Pushes made with GITHUB_TOKEN do not trigger `push` workflows, so the
  # data refresh would never reach the site. Chain off it explicitly.
  workflow_run:
    workflows: ["Update Tools Data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Skip when the data job failed or changed nothing worth deploying.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Copy data into the frontend
        run: |
          mkdir -p frontend/public/data
          cp -r public/data/. frontend/public/data/

      - name: Build
        working-directory: frontend
        env:
          # Public, non-secret settings for the "Follow" box (set under Settings > Variables).
          VITE_BUTTONDOWN_USER: ${{ vars.BUTTONDOWN_USER }}
          VITE_DISCORD_INVITE: ${{ vars.DISCORD_INVITE }}
          VITE_TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
